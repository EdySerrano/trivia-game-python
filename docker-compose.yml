# docker-compose.yml
version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: trivia_user
      POSTGRES_PASSWORD: trivia_pass
      POSTGRES_DB: trivia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://trivia_user:trivia_pass@db:5432/trivia_db
    volumes:
      - .:/app

volumes:
  postgres_data:
